[build]
  publish = "dist"
  command = "wagmi generate && yarn run build"

[build.environment]
  NODE_VERSION = "20.18.3"
  YARN_VERSION = "4.8.1"
  NPM_FLAGS = "--legacy-peer-deps"
  # Vite/Rollup holds the full module graph in memory; the default ~2GB heap
  # on Netlify's build image OOMs. Raise it so production builds complete.
  NODE_OPTIONS = "--max-old-space-size=4096"

# Notification service (netlify/notify): the /api/notify/* API plus two
# scheduled functions (watcher, deliver). See netlify/notify/README.md.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200